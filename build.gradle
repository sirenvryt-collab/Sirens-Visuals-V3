name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
          cache-read-only: false   # let every run populate the dependency cache
      - name: Build (retry on transient network failures)
        run: |
          for i in 1 2 3 4; do
            if gradle build --no-daemon; then exit 0; fi
            echo "::warning::Attempt $i failed; waiting before retry"
            sleep $((i * 60))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with: { name: SirensVisuals, path: build/libs/*.jar }
